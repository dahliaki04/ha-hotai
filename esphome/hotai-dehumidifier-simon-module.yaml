# HOTAI HT046A1 on Simon's (xangin) ready-made TaiSEIA module — same board/pins as his Hitachi
# dehumidifier build (ESP32-C3, UART TX GPIO7 / RX GPIO6, status LED GPIO8). Use THIS file, not
# hotai-dehumidifier.yaml (that one is for a bare XIAO). His pre-flashed firmware already works for
# HOTAI (TaiSEIA is generic); flash this only if you want Chinese entity names / the HA device named
# 和泰除濕機. Flash via ESPHome dashboard (OTA once it is on Wi-Fi) or web.esphome.io over Type-C.
substitutions:
  devicename: hotai-dehumidifier
  upper_devicename: "和泰除濕機"
  model_name: "HT046A1"
  
esphome:
  name: $devicename
  friendly_name: ${upper_devicename}
  comment: ESP32C3 for $model_name
  project:
    name: "TaiSEIA-Hotai.$model_name"
    version: "ESP32C3"

esp32:
  board: airm2m_core_esp32c3
  framework:
    type: arduino

external_components:
  - source: github://tsunglung/taixia@master
    components: [ taixia ]
    #refresh: 0s
    
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${devicename}
    password: "12345678"

captive_portal:

# Enable logging
logger:
  baud_rate: 0 # disable serial logging;
#  level: VERY_VERBOSE

# Enable Home Assistant API
api:

ota:
  - platform: esphome

web_server:

uart:
  id: uart_taixia
  tx_pin: GPIO7 #pin3 (RX to AC)
  rx_pin: GPIO6 #pin4 (TX from AC)
  baud_rate: 9600
  debug:
    direction: BOTH

status_led:
  pin:
    number: GPIO8 # Blue LED

# optional binary sensor to monitor serial connection:
binary_sensor:
  - platform: status
    name: "Status"
  - platform: taixia
    type: dehumidifier
    water_tank_full:
      name: "Water Tank Full"
    filter_notify:
      name: "Filter Notify"
    # side_air_flow:
    #   name: "Side Air Flow"
    # defrost:
    #   name: "Defrost"
      
button:
  - platform: safe_mode
    name: "Safe Mode Boot"
    entity_category: diagnostic
  - platform: restart
    name: "Restart"
  - platform: taixia
    type: dehumidifier
    get_info:
      name: "Get Info"

fan:
  - platform: taixia
    name: Fan
    type: dehumidifier
    id: fan_dehumidifier
    speed: true
    speed_count: 4
    preset_modes:
      - normal
      - home
      - boost
      - sleep
      - eco



number:
  - platform: taixia
    type: dehumidifier
    operating_time:
      name: "Operating Time"
    relative_humidity:
      name: "Relative Humidity"
    #fan_level:
    #  name: "Fan Level"
    #sound_mode:
    #  name: "Sound Mode"
    light_level:
      name: "Light Level"


select:
  - platform: taixia
    type: dehumidifier
    operating_program:
      name: "Operation Mode"
      options:
        - normal
        - eco
        - home
        - boost
        - sleep

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    filters:
      - lambda: return x / 3600;
    unit_of_measurement: "h"
    accuracy_decimals: 1

  - platform: internal_temperature
    name: "Internal Temperature"

  - platform: taixia
    type: dehumidifier
    humidity_indoor:
      name: "Humidity Indoor"    
    energy_consumption:
      name: "Energy"
    error_code:
      name: "Error Code"
    # pm_2_5:
    #   name: "PM 2.5"
    # odours:
    #   name: "Odours"

switch:
  - platform: taixia
    type: dehumidifier
    power:
      name: "Power Switch"
    #lock:
    #  name: "Lock"
    air_flow_auto:
      name: "Auto Air Flow"
    #mildew_proof:
    #  name: "Mildew Proof"
    humidity_notify:
      name: "Humidity Notify"
    beeper:
      name: "Beeper"
    air_purifier:
      name: "Air Purifier"
    #pm25_detect:
    #  name: "PM2.5 Detect"


text_sensor:
  - platform: version
    name: "ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "IP Address"
  - platform: taixia
    sa_id:
      name: "SA ID"
      id: sa_id
    brand:
      name: "SA Brand"
    model:
      name: "SA Model"
    version:
      name: "SA Version"
    services:
      name: "SA Services"

taixia:
  sa_id: 4
#  response_time: 0

time:
  - platform: homeassistant
    id: homeassistant_time
